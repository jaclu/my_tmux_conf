[project]
requires-python = ">=3.11"

[tool.mypy]
python_version = "3.11"                       # Matches requires-python = ">=3.11"
exclude = ['\.venv/', 'stuff/dead_code\.py$']
show_error_codes = true
warn_unused_configs = true
no_implicit_reexport = true

[tool.pymarkdown]
plugins.line-length.line_length = 92
plugins.line-length.code_block_line_length = 92
plugins.md033.allowed_elements = "nbsp,prefix"

[tool.pyright]
exclude = [".venv", "**/__pycache__"]
reportMissingImports = "error"

[tool.ruff]
line-length = 92
extend-exclude = ["tools/dead-code"]
force-exclude = true

[tool.ruff.lint]
# more opinionated and modernization-oriented
select = ["E", "F", "W", "I", "UP", "BLE"]
# more conservative selections
# select = ["E4", "E7", "E9", "F", "I", "B", "UP", ]
fixable = ["I", "UP"]
ignore = ["E501"]     # line length is left to the formatter

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
line-ending = "lf"
