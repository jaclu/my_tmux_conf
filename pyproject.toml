[project]
requires-python = ">=3.11"

[tool.black]
target-version = ["py311"]
force-exclude = '/tools/dead-code/'

[tool.isort]
profile = "black"
combine_as_imports = true
extend_skip_glob = ["tools/dead-code/*"]
filter_files = true

[tool.mypy]
python_version = "3.11"                       # Matches requires-python = ">=3.11"
exclude = ['\.venv/', 'stuff/dead_code\.py$']
show_error_codes = true
warn_unused_configs = true
no_implicit_reexport = true

[tool.pymarkdown]
plugins.line-length.line_length = 92
plugins.line-length.code_block_line_length = 92
plugins.md033.allowed_elements = "nbsp,prefix"

[tool.pyright]
exclude = [".venv", "**/__pycache__"]
reportMissingImports = "error"

[tool.ruff]
extend-exclude = ["tools/dead-code"]
force-exclude = true

[tool.ruff.lint]
# more opinionated and modernization-oriented
select = ["E", "F", "W", "I", "UP", "BLE"]
# more conservative selections
# select = ["E4", "E7", "E9", "F", "I", "B", "UP", ]

fixable = ["I", "UP"]

ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true # must match isort's combine_as_imports

[tool.ruff.format]
line-ending = "lf"
